[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarea-desoft"
version = "0.1.0"
description = "Segmentación de estructuras en discos protoplanetarios usando DSHARP y SAM"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alonso Robredo Bovet, Christian Álvarez, Lindsay Rincón Torres, Simona Serqueira y Sebastián Torres Carrasco.", email = "Alonso.Robredo@usach.cl" }
]
dependencies = [
    "astropy>=5.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
    "streamlit>=1.25.0",
    "opencv-python>=4.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
demo = "demo.demo_sam:main"