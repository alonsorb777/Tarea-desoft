[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarea-desoft"
version = "0.1.0"
description = "Herramientas de carga, segmentación y visualización de imágenes astronómicas FITS"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Christian Álvarez" },
    { name = "Lindsay Rincón" },
    { name = "Alonso Robredo" },
    { name = "Simona Serqueira" },
    { name = "Sebastián Torres" },
]
dependencies = [
    "numpy",
    "matplotlib",
    "astropy",
    "opencv-python",
    "segment-anything",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
